<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SuporteDesk - Sistema de Atendimento</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #0f172a; color: #f8fafc; }
        .toast {
            position: fixed; bottom: 20px; right: 20px; z-index: 9999;
            padding: 12px 24px; border-radius: 8px; font-weight: 500;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
            transition: all 0.3s ease; opacity: 0; transform: translateY(20px);
        }
        .toast.show { opacity: 1; transform: translateY(0); }
        .toast-success { background-color: #10b981; color: white; }
        .toast-error { background-color: #ef4444; color: white; }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between">

    <div id="toast" class="toast"></div>

    <main class="flex-grow flex items-center justify-center p-4">

        <!-- TELA DE AUTENTICAÇÃO -->
        <div id="auth-container" class="w-full max-w-md bg-slate-900 border border-slate-800 p-8 rounded-2xl shadow-2xl">
            <div class="text-center mb-6">
                <i class="fa-solid fa-headset text-indigo-500 text-4xl mb-2"></i>
                <h1 id="auth-title" class="text-2xl font-bold">Entrar no SuporteDesk</h1>
                <p class="text-slate-400 text-sm">Central de Atendimento Inteligente</p>
            </div>

            <form id="auth-form" onsubmit="handleAuth(event)" class="space-y-4">
                <div id="name-field" class="hidden">
                    <label class="block text-xs font-semibold text-slate-400 uppercase mb-1">Nome Completo</label>
                    <input type="text" id="name" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-4 py-2.5 text-white focus:outline-none focus:border-indigo-500">
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-400 uppercase mb-1">E-mail</label>
                    <input type="email" id="email" required class="w-full bg-slate-800 border border-slate-700 rounded-lg px-4 py-2.5 text-white focus:outline-none focus:border-indigo-500">
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-400 uppercase mb-1">Palavra-passe</label>
                    <input type="password" id="password" required class="w-full bg-slate-800 border border-slate-700 rounded-lg px-4 py-2.5 text-white focus:outline-none focus:border-indigo-500">
                </div>

                <div id="role-field" class="hidden">
                    <label class="block text-xs font-semibold text-slate-400 uppercase mb-1">Tipo de Conta</label>
                    <select id="role" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-4 py-2.5 text-white focus:outline-none focus:border-indigo-500">
                        <option value="cliente">Cliente (Abrir Chamados)</option>
                        <option value="atendente">Atendente (Gerir e Responder)</option>
                    </select>
                </div>

                <button type="submit" id="auth-btn" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-medium py-2.5 rounded-lg transition">Entrar</button>
            </form>

            <div class="text-center mt-4">
                <button type="button" onclick="toggleAuthMode()" id="toggle-auth-text" class="text-sm text-indigo-400 hover:underline">Não tem conta? Registe-se</button>
            </div>
        </div>

        <!-- DASHBOARD -->
        <div id="dashboard-container" class="w-full max-w-6xl hidden space-y-6">
            <header class="bg-slate-900 border border-slate-800 px-6 py-4 rounded-2xl flex justify-between items-center shadow-lg">
                <div class="flex items-center space-x-3">
                    <i class="fa-solid fa-headset text-indigo-500 text-2xl"></i>
                    <h2 class="text-xl font-bold">Painel de Chamados (<span id="user-role-label" class="text-indigo-400 text-sm"></span>)</h2>
                </div>
                <div class="flex items-center space-x-4">
                    <span class="text-sm text-slate-300">Olá, <b id="user-name-display" class="text-white"></b></span>
                    <button onclick="logout()" class="bg-red-600/20 hover:bg-red-600 text-red-400 hover:text-white px-4 py-2 rounded-lg text-sm font-medium transition">Encerrar Sessão</button>
                </div>
            </header>

            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                <div class="bg-slate-900 border border-slate-800 p-5 rounded-2xl">
                    <p class="text-slate-400 text-sm">Total de Chamados</p>
                    <h3 id="stat-total" class="text-3xl font-bold mt-1">0</h3>
                </div>
                <div class="bg-slate-900 border border-slate-800 p-5 rounded-2xl">
                    <p class="text-slate-400 text-sm">Em Aberto</p>
                    <h3 id="stat-open" class="text-3xl font-bold mt-1 text-yellow-500">0</h3>
                </div>
                <div class="bg-slate-900 border border-slate-800 p-5 rounded-2xl">
                    <p class="text-slate-400 text-sm">Concluídos</p>
                    <h3 id="stat-closed" class="text-3xl font-bold mt-1 text-emerald-500">0</h3>
                </div>
            </div>

            <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-lg">
                <div class="flex justify-between items-center mb-6">
                    <h3 class="text-lg font-semibold">Histórico de Solicitações</h3>
                    <div class="flex space-x-3">
                        <button onclick="loadTickets()" class="bg-slate-800 hover:bg-slate-700 text-slate-300 px-3 py-2 rounded-lg text-sm font-medium transition flex items-center space-x-2" title="Atualizar Lista">
                            <i class="fa-solid fa-sync-alt"></i> <span>Atualizar</span>
                        </button>
                        <button id="btn-new-ticket" onclick="openTicketModal()" class="bg-indigo-600 hover:bg-indigo-500 text-white px-4 py-2 rounded-lg text-sm font-medium transition flex items-center space-x-2">
                            <i class="fa-solid fa-plus"></i> <span>Novo Chamado</span>
                        </button>
                    </div>
                </div>

                <div class="overflow-x-auto">
                    <table class="w-full text-left border-collapse">
                        <thead>
                            <tr class="border-b border-slate-800 text-slate-400 text-xs uppercase tracking-wider">
                                <th class="py-3 px-4">ID</th>
                                <th id="th-client" class="py-3 px-4 hidden">Cliente</th>
                                <th class="py-3 px-4">Título & Descrição</th>
                                <th class="py-3 px-4">Status</th>
                                <th class="py-3 px-4">Resposta</th>
                                <th class="py-3 px-4 text-right">Ações</th>
                            </tr>
                        </thead>
                        <tbody id="tickets-table-body" class="divide-y divide-slate-800 text-sm">
                            <tr><td colspan="6" class="text-center py-6 text-slate-500">Nenhum registo encontrado.</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

    </main>

    <!-- MODAL NOVO CHAMADO -->
    <div id="ticket-modal" class="fixed inset-0 bg-black/60 backdrop-blur-sm hidden items-center justify-center p-4 z-50">
        <div class="bg-slate-900 border border-slate-800 w-full max-w-md p-6 rounded-2xl space-y-4">
            <h3 class="text-xl font-bold">Abrir Novo Chamado</h3>
            <form id="ticket-form" onsubmit="createTicket(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-400 uppercase mb-1">Título</label>
                    <input type="text" id="ticket-title" required class="w-full bg-slate-800 border border-slate-700 rounded-lg px-4 py-2.5 text-white focus:outline-none focus:border-indigo-500">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-400 uppercase mb-1">Descrição do Problema</label>
                    <textarea id="ticket-desc" rows="4" required class="w-full bg-slate-800 border border-slate-700 rounded-lg px-4 py-2.5 text-white focus:outline-none focus:border-indigo-500"></textarea>
                </div>
                <div class="flex justify-end space-x-3">
                    <button type="button" onclick="closeTicketModal()" class="bg-slate-800 hover:bg-slate-700 px-4 py-2 rounded-lg text-sm transition">Cancelar</button>
                    <button type="submit" class="bg-indigo-600 hover:bg-indigo-500 px-4 py-2 rounded-lg text-sm font-medium transition">Enviar Chamado</button>
                </div>
            </form>
        </div>
    </div>

    <!-- MODAL RESPOSTA -->
    <div id="response-modal" class="fixed inset-0 bg-black/60 backdrop-blur-sm hidden items-center justify-center p-4 z-50">
        <div class="bg-slate-900 border border-slate-800 w-full max-w-md p-6 rounded-2xl space-y-4">
            <h3 class="text-xl font-bold">Gerir / Responder Chamado</h3>
            <form id="response-form" onsubmit="submitResponse(event)" class="space-y-4">
                <input type="hidden" id="resp-ticket-id">
                <div>
                    <label class="block text-xs font-semibold text-slate-400 uppercase mb-1">Status</label>
                    <select id="resp-status" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-4 py-2.5 text-white focus:outline-none focus:border-indigo-500">
                        <option value="Aberto">Aberto</option>
                        <option value="Em Andamento">Em Andamento</option>
                        <option value="Concluído">Concluído</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-400 uppercase mb-1">Resposta ao Cliente</label>
                    <textarea id="resp-text" rows="4" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-4 py-2.5 text-white focus:outline-none focus:border-indigo-500" placeholder="Escreva a resposta técnica..."></textarea>
                </div>
                <div class="flex justify-end space-x-3">
                    <button type="button" onclick="closeResponseModal()" class="bg-slate-800 hover:bg-slate-700 px-4 py-2 rounded-lg text-sm transition">Cancelar</button>
                    <button type="submit" class="bg-indigo-600 hover:bg-indigo-500 px-4 py-2 rounded-lg text-sm font-medium transition">Guardar Alterações</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        const API_URL = '';
        let isRegistering = false;
        let currentUser = JSON.parse(localStorage.getItem('suportedesk_user')) || null;
        let refreshInterval = null;

        function showToast(message, type = 'success') {
            const toast = document.getElementById('toast');
            toast.className = `toast toast-${type} show`;
            toast.innerText = message;
            setTimeout(() => { toast.classList.remove('show'); }, 3000);
        }

        function toggleAuthMode() {
            isRegistering = !isRegistering;
            document.getElementById('auth-title').innerText = isRegistering ? 'Criar Conta no SuporteDesk' : 'Entrar no SuporteDesk';
            document.getElementById('auth-btn').innerText = isRegistering ? 'Registar' : 'Entrar';
            document.getElementById('toggle-auth-text').innerText = isRegistering ? 'Já tem conta? Faça login' : 'Não tem conta? Registe-se';
            document.getElementById('name-field').classList.toggle('hidden', !isRegistering);
            document.getElementById('role-field').classList.toggle('hidden', !isRegistering);
        }

        async function handleAuth(event) {
            event.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const name = document.getElementById('name').value;
            const role = document.getElementById('role').value;

            const endpoint = isRegistering ? '/auth/register' : '/auth/login';
            const payload = isRegistering ? { name, email, password, role } : { email, password };

            try {
                const res = await fetch(`${API_URL}${endpoint}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                const data = await res.json();

                if (data.success) {
                    if (isRegistering) {
                        showToast('Conta criada com sucesso! Faça login.');
                        toggleAuthMode();
                    } else {
                        currentUser = data.user;
                        localStorage.setItem('suportedesk_user', JSON.stringify(currentUser));
                        checkAuthSession();
                        showToast('Sessão iniciada com sucesso!');
                    }
                } else {
                    showToast(data.error || 'Erro na autenticação', 'error');
                }
            } catch (err) {
                showToast('Erro de conexão com o servidor', 'error');
            }
        }

        function logout() {
            localStorage.removeItem('suportedesk_user');
            currentUser = null;
            if (refreshInterval) clearInterval(refreshInterval);
            checkAuthSession();
            showToast('Sessão encerrada.');
        }

        function checkAuthSession() {
            if (currentUser) {
                document.getElementById('auth-container').classList.add('hidden');
                document.getElementById('dashboard-container').classList.remove('hidden');
                document.getElementById('user-name-display').innerText = currentUser.name;
                document.getElementById('user-role-label').innerText = currentUser.role.toUpperCase();

                if (currentUser.role === 'atendente') {
                    document.getElementById('btn-new-ticket').classList.add('hidden');
                    document.getElementById('th-client').classList.remove('hidden');
                } else {
                    document.getElementById('btn-new-ticket').classList.remove('hidden');
                    document.getElementById('th-client').classList.add('hidden');
                }
                loadTickets();

                // Ativa a atualização automática a cada 5 segundos
                if (!refreshInterval) {
                    refreshInterval = setInterval(() => {
                        loadTickets(true);
                    }, 5000);
                }
            } else {
                document.getElementById('auth-container').classList.remove('hidden');
                document.getElementById('dashboard-container').classList.add('hidden');
                if (refreshInterval) clearInterval(refreshInterval);
            }
        }

        async function loadTickets(silent = false) {
            if (!currentUser) return;
            try {
                const res = await fetch(`${API_URL}/tickets?userId=${currentUser.id}&role=${currentUser.role}`);
                const tickets = await res.json();
                
                const tbody = document.getElementById('tickets-table-body');
                tbody.innerHTML = '';

                let total = tickets.length;
                let open = tickets.filter(t => t.status === 'Aberto' || t.status === 'Em Andamento').length;
                let closed = tickets.filter(t => t.status === 'Concluído').length;

                document.getElementById('stat-total').innerText = total;
                document.getElementById('stat-open').innerText = open;
                document.getElementById('stat-closed').innerText = closed;

                if (tickets.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="6" class="text-center py-6 text-slate-500">Nenhum registo encontrado.</td></tr>`;
                    return;
                }

                tickets.forEach(t => {
                    const tr = document.createElement('tr');
                    tr.className = 'hover:bg-slate-800/50 transition';

                    let badgeColor = 'bg-yellow-500/20 text-yellow-400';
                    if (t.status === 'Em Andamento') badgeColor = 'bg-blue-500/20 text-blue-400';
                    if (t.status === 'Concluído') badgeColor = 'bg-emerald-500/20 text-emerald-400';

                    let clientColumn = currentUser.role === 'atendente' ? `<td class="py-3 px-4 font-medium text-slate-300">${t.clientName || 'Cliente'}</td>` : '';

                    tr.innerHTML = `
                        <td class="py-3 px-4 font-mono text-slate-400">#${t.id}</td>
                        ${clientColumn}
                        <td class="py-3 px-4">
                            <div class="font-semibold text-white">${t.title}</div>
                            <div class="text-xs text-slate-400">${t.description}</div>
                        </td>
                        <td class="py-3 px-4"><span class="px-2.5 py-1 rounded-full text-xs font-semibold ${badgeColor}">${t.status}</span></td>
                        <td class="py-3 px-4 text-slate-300 text-xs">${t.response ? t.response : '<span class="text-slate-500 italic">Sem resposta</span>'}</td>
                        <td class="py-3 px-4 text-right space-x-2">
                            ${currentUser.role === 'atendente' ? `<button onclick="openResponseModal(${t.id}, '${t.status}', '${t.response || ''}')" class="text-indigo-400 hover:text-indigo-300 text-xs font-medium bg-indigo-500/10 px-3 py-1.5 rounded-lg transition"><i class="fa-solid fa-reply"></i> Gerir</button>` : ''}
                            <button onclick="deleteTicket(${t.id})" class="text-red-400 hover:text-red-300 text-xs font-medium bg-red-500/10 px-3 py-1.5 rounded-lg transition"><i class="fa-solid fa-trash"></i></button>
                        </td>
                    `;
                    tbody.appendChild(tr);
                });
            } catch (err) {
                if (!silent) showToast('Erro ao carregar chamados', 'error');
            }
        }

        function openTicketModal() { document.getElementById('ticket-modal').classList.remove('hidden'); document.getElementById('ticket-modal').classList.add('flex'); }
        function closeTicketModal() { document.getElementById('ticket-modal').classList.add('hidden'); document.getElementById('ticket-modal').classList.remove('flex'); }

        async function createTicket(event) {
            event.preventDefault();
            const title = document.getElementById('ticket-title').value;
            const description = document.getElementById('ticket-desc').value;

            if (!currentUser || !currentUser.id) {
                showToast('Sessão expirada. Faça login novamente.', 'error');
                logout();
                return;
            }

            try {
                const res = await fetch(`${API_URL}/tickets`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ title, description, userId: currentUser.id })
                });
                const data = await res.json();
                if (data.success) {
                    showToast('Chamado criado com sucesso!');
                    closeTicketModal();
                    document.getElementById('ticket-form').reset();
                    loadTickets();
                } else {
                    showToast(data.error || 'Erro ao criar chamado', 'error');
                }
            } catch (err) {
                showToast('Erro de conexão ao criar chamado', 'error');
            }
        }

        function openResponseModal(id, status, response) {
            document.getElementById('resp-ticket-id').value = id;
            document.getElementById('resp-status').value = status;
            document.getElementById('resp-text').value = response;
            document.getElementById('response-modal').classList.remove('hidden');
            document.getElementById('response-modal').classList.add('flex');
        }
        function closeResponseModal() { document.getElementById('response-modal').classList.add('hidden'); document.getElementById('response-modal').classList.remove('flex'); }

        async function submitResponse(event) {
            event.preventDefault();
            const id = document.getElementById('resp-ticket-id').value;
            const status = document.getElementById('resp-status').value;
            const response = document.getElementById('resp-text-id') ? document.getElementById('resp-text-id').value : document.getElementById('resp-text').value;

            try {
                const res = await fetch(`${API_URL}/tickets/${id}`, {
                    method: 'PATCH',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ status, response })
                });
                const data = await res.json();
                if (data.success) {
                    showToast('Chamado atualizado com sucesso!');
                    closeResponseModal();
                    loadTickets();
                }
            } catch (err) {
                showToast('Erro ao atualizar chamado', 'error');
            }
        }

        async function deleteTicket(id) {
            if (!confirm('Tem certeza que deseja remover este chamado?')) return;
            try {
                const res = await fetch(`${API_URL}/tickets/${id}`, { method: 'DELETE' });
                const data = await res.json();
                if (data.success) {
                    showToast('Chamado removido!');
                    loadTickets();
                }
            } catch (err) {
                showToast('Erro ao remover chamado', 'error');
            }
        }

        checkAuthSession();
    </script>
</body>
</html>
